name: bluepos_app
description: BluePOS mobile client for approved retail and wholesale workspaces.
publish_to: none
version: 0.3.0+4

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.3.3
  geolocator: ^13.0.2
  mobile_scanner: ^6.0.11
  decimal: ^3.2.1
  local_auth: ^3.0.2
  pdf: ^3.12.0
  printing: ^5.15.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/branding/bluepos_launcher.png
  adaptive_icon_background: '#0B47C4'
  adaptive_icon_foreground: assets/branding/bluepos_foreground.png

flutter:
  uses-material-design: true
  assets:
    - assets/branding/bluepos_launcher.png
