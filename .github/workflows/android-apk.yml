name: Build Android APK

on:
  push:
    branches: [feature/daily-entries]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform
        run: flutter create --platforms=android --org pk.com.bluemarketing --project-name bluepos_app .

      - name: Remove generated Flutter starter test
        run: rm -f test/widget_test.dart

      - name: Apply Android permissions
        run: python3 tool/patch_android.py

      - name: Resolve Flutter dependencies
        run: flutter pub get

      - name: Analyze source
        run: flutter analyze --no-fatal-infos

      - name: Run mobile focused tests
        run: flutter test

      - name: Build installable debug APK
        run: flutter build apk --debug

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: BluePOS-Mobile-0.1.0-debug-APK
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      # One-off public pre-release, only when the explicit publish commit is pushed.
      - name: Publish downloadable preview APK
        if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[publish-apk]') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create mobile-v0.1.0-preview \
            "build/app/outputs/flutter-apk/app-debug.apk#BluePOS-Mobile-v0.1.0-preview.apk" \
            --target "$GITHUB_SHA" \
            --title "BluePOS Mobile v0.1.0 — Android preview APK" \
            --notes "Development preview (debug-signed Android APK), not a production release. Connects to the configured live BluePOS API. Install and log in only with an authorized test account and approved device. Sale posting is a real financial/stock operation." \
            --prerelease
