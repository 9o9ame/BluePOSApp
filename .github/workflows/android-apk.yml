name: Validate & Build BluePOS Mobile Android

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate isolated Android platform
        run: flutter create --platforms=android --org pk.com.bluemarketing --project-name bluepos_app .

      - name: Remove Flutter generated starter test
        run: rm -f test/widget_test.dart

      - name: Configure Android security and biometrics
        run: python3 tool/patch_android.py

      - name: Resolve exact app dependencies
        run: flutter pub get

      - name: Create BluePOS Android launcher icons
        run: dart run flutter_launcher_icons

      - name: Flutter static analysis
        run: flutter analyze --no-fatal-infos

      - name: Focused Flutter tests
        run: flutter test

      - name: Build optimized Android APK
        run: flutter build apk --release

      - name: Verify APK and checksum
        run: |
          test -s build/app/outputs/flutter-apk/app-release.apk
          sha256sum build/app/outputs/flutter-apk/app-release.apk

      - name: Upload validated Android APK
        uses: actions/upload-artifact@v4
        with:
          name: BluePOS-Mobile-v0.2.1-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

      # A public release is published ONLY for an explicitly marked commit.
      - name: Publish GitHub direct-download APK
        if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[publish-apk]') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create mobile-v0.2.1-preview \
            'build/app/outputs/flutter-apk/app-release.apk#BluePOS-Mobile-v0.2.1-preview.apk' \
            --target "$GITHUB_SHA" \
            --title 'BluePOS Mobile 0.2.1 - Android preview' \
            --notes 'Independent Flutter client. Validated in GitHub CI. This preview uses default Flutter-generated signing; a persistent production signing key is needed for final Play Store distribution and in-place updates. First authorized server login requires mart code, password, device/location approval and any MFA. Optional fingerprint/face can only unlock a still-valid approved session. Uses live BluePOS API; sale posting changes real stock and financial records. Test with an authorized test tenant.' \
            --prerelease
