name: Validate & Build BluePOS Mobile Android

on:
  workflow_dispatch:
  push:
    branches: [feature/daily-entries]

permissions:
  contents: write

jobs:
  build-android:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[publish-apk]')
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate isolated Android platform
        run: flutter create --platforms=android --org pk.com.bluemarketing --project-name bluepos_app .

      - name: Remove Flutter generated starter test
        run: rm -f test/widget_test.dart

      - name: Configure Android security and biometrics
        run: python3 tool/patch_android.py

      - name: Resolve exact app dependencies
        run: flutter pub get

      - name: Create BluePOS Android launcher icons
        run: dart run flutter_launcher_icons

      - name: Flutter static analysis
        run: flutter analyze --no-fatal-infos

      - name: Focused Flutter tests
        run: flutter test

      - name: Build optimized Android APK
        run: flutter build apk --release --split-per-abi

      - name: Verify APK and checksum
        run: |
          test -s build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          sha256sum build/app/outputs/flutter-apk/app-arm64-v8a-release.apk

      - name: Upload validated Android APK
        uses: actions/upload-artifact@v4
        with:
          name: BluePOS-Mobile-v0.3.0-Android-arm64-APK
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          if-no-files-found: error
          retention-days: 30

      # A public release is published ONLY for an explicitly marked commit.
      - name: Publish GitHub direct-download APK
        if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[publish-apk]') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create mobile-v0.3.0-testing \
            'build/app/outputs/flutter-apk/app-arm64-v8a-release.apk#BluePOS-Mobile-v0.3.0-test-arm64.apk' \
            --target "$GITHUB_SHA" \
            --title 'BluePOS Mobile 0.3.0 - Android ARM64 test build' \
            --notes 'Android ARM64 test APK for Redmi Note 10 and similar arm64 devices. This is a pre-release; module integration and physical camera/biometrics still require testing. APK is signed with the temporary Flutter generated signing key: uninstall older previews if Android reports a signature conflict; release upgrades need a persistent production key. Live BluePOS API is used; posting will affect the selected tenant financials and stock. Use authorized test tenant records, not production data.' \
            --prerelease
